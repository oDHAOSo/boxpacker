<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BoxPacker Pro | Metrics &amp; Interaction</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body { margin: 0; overflow: hidden; background: #0a0a0a; font-family: "Segoe UI", sans-serif; color: white; }
        #ui { position: absolute; top: 20px; right: 20px; width: min(390px, calc(100vw - 40px)); background: rgba(25, 25, 25, 0.98); padding: 20px; border-radius: 12px; border: 1px solid #444; max-height: calc(100vh - 40px); overflow-y: auto; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7); z-index: 1000; }
        h2 { margin: 0 0 15px; color: #4d79ff; font-size: 1.2em; border-bottom: 1px solid #333; padding-bottom: 10px; }

        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; background: #111; padding: 12px; border-radius: 8px; border: 1px solid #333; }
        .metric-card { font-size: 0.7em; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
        .metric-value { font-size: 1.05em; color: #4dff4d; font-weight: bold; margin-top: 2px; }

        .section-title { font-size: 0.8em; text-transform: uppercase; color: #aaa; margin: 20px 0 10px; font-weight: bold; letter-spacing: 1px; }
        .view-toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .view-toolbar .btn { margin: 0; }
        .view-toolbar .wide { grid-column: 1 / -1; }
        .btn { background: #333; color: white; border: 1px solid #555; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; margin-bottom: 10px; }
        .btn:hover { background: #3d3d3d; border-color: #777; }
        .btn[aria-pressed="true"], .btn.active { background: #274fbf; border-color: #7392ff; }
        .btn:disabled { cursor: not-allowed; opacity: 0.45; }
        .container-card { background: #1a1a1a; border-radius: 8px; margin-bottom: 10px; border: 1px solid #292929; border-left: 4px solid #4d79ff; overflow: hidden; }
        .container-card.active { border-color: #7392ff; border-left-color: #4dff4d; box-shadow: 0 0 0 1px rgba(77, 121, 255, 0.35); }
        .container-select { appearance: none; display: block; width: 100%; padding: 12px; background: transparent; color: white; border: 0; text-align: left; cursor: pointer; }
        .container-select:hover { background: #252525; }
        .container-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-weight: bold; }
        .container-meta { display: block; margin-top: 5px; color: #777; font-size: 0.78em; }
        .item-list { margin-top: 8px; }
        .item-row { appearance: none; display: grid; grid-template-columns: 2.2em minmax(0, 1fr) auto; gap: 7px; align-items: center; width: 100%; padding: 6px 8px; background: transparent; color: white; border: 0; border-bottom: 1px solid #222; cursor: pointer; border-radius: 4px; font: inherit; font-size: 0.85em; text-align: left; }
        .item-row:hover { background: #333; color: #4d79ff; }
        .placement-step { display: inline-grid; place-items: center; width: 1.8em; height: 1.8em; border-radius: 50%; background: #273a70; color: #b9c9ff; font-size: 0.78em; font-weight: bold; }
        .item-name { min-width: 0; overflow-wrap: anywhere; }
        .item-dimensions { color: #666; }
        .container-card .item-list { display: none; padding: 0 8px 10px; margin-top: 0; }
        .container-card.active .item-list { display: block; }

        #layer-controls { margin: 10px 0 2px; padding: 12px; background: #111827; border: 1px solid #2c467a; border-radius: 8px; }
        #layer-controls[hidden] { display: none; }
        .layer-header { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
        #layer-position { color: #8fadff; font-size: 0.78em; text-align: right; }
        .layer-slider-row { display: grid; grid-template-columns: 38px 1fr 38px; gap: 8px; align-items: center; margin: 10px 0; }
        .layer-step { width: 38px; height: 34px; padding: 0; margin: 0; }
        #layer-slider { width: 100%; accent-color: #4d79ff; }
        #layer-items { color: #b8c7e8; font-size: 0.78em; line-height: 1.45; margin-bottom: 10px; }
        #reset-layer-camera { margin: 0; }
        .hint { color: #777; font-size: 0.76em; line-height: 1.4; margin-top: 8px; }

        .unplaced-section { background: #2a1515; padding: 12px; border-radius: 8px; border-left: 4px solid #ff4d4d; }
        .item-tag { display: inline-block; background: #444; padding: 2px 8px; border-radius: 4px; margin: 2px; font-size: 0.75em; color: #eee; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

        @media (max-width: 700px) {
            #ui { top: 10px; right: 10px; max-height: min(56vh, 520px); width: calc(100vw - 20px); padding: 14px; }
        }
    </style>
</head>
<body>
    <div id="ui">
        <h2>Logistics Overview</h2>
        <div id="global-metrics" class="metrics-grid"></div>

        <div class="section-title">View</div>
        <div class="view-toolbar">
            <button id="show-all" class="btn wide" type="button">Show All Containers</button>
            <button id="solid-view" class="btn" type="button">3D View</button>
            <button id="layer-view" class="btn" type="button">Layer View</button>
        </div>
        <div id="layer-controls" hidden>
            <div class="layer-header">
                <strong id="layer-label">Layer</strong>
                <span id="layer-position"></span>
            </div>
            <div class="layer-slider-row">
                <button id="previous-layer" class="btn layer-step" type="button" aria-label="Previous layer">−</button>
                <input id="layer-slider" type="range" min="0" max="0" value="0" aria-label="Cross-section layer">
                <button id="next-layer" class="btn layer-step" type="button" aria-label="Next layer">+</button>
            </div>
            <div id="layer-items"></div>
            <button id="reset-layer-camera" class="btn" type="button">Reset Top View</button>
            <div class="hint">
                Full-size boxes for this step; earlier boxes are faint. Drag to orbit; scroll to zoom.
            </div>
        </div>

        <div class="section-title">Containers</div>
        <div id="containers-list"></div>

        <div class="section-title">Unplaced Items</div>
        <div id="unplaced-list"></div>

        <button id="wireframe-toggle" class="btn" type="button">Toggle X-Ray View</button>
    </div>

    <script id="boxpacker-report-data" type="application/json">__BOXPACKER_REPORT_DATA__</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        "use strict";

        const reportData = JSON.parse(document.getElementById("boxpacker-report-data").textContent);
        const containers = reportData.containers;
        const unplaced = reportData.unplaced_items;
        const meshes = [];
        const containerViews = [];
        const galleryColumns = Math.max(1, Math.ceil(Math.sqrt(containers.length)));
        const maxContainerWidth = Math.max(1, ...containers.map((container) => container.width));
        const maxContainerLength = Math.max(1, ...containers.map((container) => container.length));
        let selectedContainerIndex = containers.length === 0 ? null : 0;
        let viewMode = "solid";
        let layerIndex = 0;
        let highlightedObject = null;
        let rainbowTimer = 0;

        function appendMetric(parent, label, value, color) {
            const card = document.createElement("div");
            card.className = "metric-card";
            card.append(document.createTextNode(label));

            const metricValue = document.createElement("div");
            metricValue.className = "metric-value";
            if (color) {
                metricValue.style.color = color;
            }
            metricValue.textContent = value;
            card.append(metricValue);
            parent.append(card);
        }

        let totalContainerVolume = 0;
        let usedContainerVolume = 0;
        let totalUsedVolume = 0;
        let totalItemsVolume = 0;

        containers.forEach((container) => {
            const containerVolume = container.width * container.height * container.length;
            totalContainerVolume += containerVolume;
            if (container.placed_items.length > 0) {
                usedContainerVolume += containerVolume;
            }
            container.placed_items.forEach((item) => {
                const volume = item.coords.w * item.coords.l * item.coords.h;
                totalUsedVolume += volume;
                totalItemsVolume += volume;
            });
        });
        unplaced.forEach((item) => {
            totalItemsVolume += item.width * item.length * item.height;
        });

        const unplacedVolume = totalItemsVolume - totalUsedVolume;
        const unusedCapacity = totalContainerVolume - totalUsedVolume;
        const globalUtilization = totalContainerVolume === 0
            ? "0.0"
            : ((totalUsedVolume / totalContainerVolume) * 100).toFixed(1);
        const usedContainerUtilization = usedContainerVolume === 0
            ? "0.0"
            : ((totalUsedVolume / usedContainerVolume) * 100).toFixed(1);
        const globalMetrics = document.getElementById("global-metrics");

        appendMetric(globalMetrics, "Container Vol", totalContainerVolume.toLocaleString());
        appendMetric(globalMetrics, "Content Vol", totalItemsVolume.toLocaleString(), "#4d79ff");
        appendMetric(globalMetrics, "Used Capacity", totalUsedVolume.toLocaleString());
        appendMetric(globalMetrics, "Unused Cap", unusedCapacity.toLocaleString(), "#ffb347");
        appendMetric(globalMetrics, "Unplaced Vol", unplacedVolume.toLocaleString(), "#ff4d4d");
        appendMetric(
            globalMetrics,
            "Utilization (of used)",
            `${globalUtilization}% (${usedContainerUtilization}%)`
        );

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 30000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.append(renderer.domElement);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        scene.add(new THREE.AmbientLight(0xffffff, 0.9));

        function createLabel(text, scale = 30) {
            const canvas = document.createElement("canvas");
            const context = canvas.getContext("2d");
            canvas.width = 512;
            canvas.height = 128;
            context.fillStyle = "white";
            context.font = "bold 38px Arial";
            context.textAlign = "center";
            context.shadowColor = "black";
            context.shadowBlur = 8;
            context.fillText(text, 256, 80);
            const material = new THREE.SpriteMaterial({
                map: new THREE.CanvasTexture(canvas),
                depthTest: false,
                transparent: true
            });
            const sprite = new THREE.Sprite(material);
            sprite.scale.set(scale, scale / 4, 1);
            sprite.renderOrder = 2000;
            return sprite;
        }

        function layerBoundaries(container) {
            const bottoms = [0, ...container.placed_items.map((item) => item.coords.z)]
                .filter((height) => height >= 0 && height < container.height)
                .sort((left, right) => left - right);
            return bottoms.filter((height, index) => index === 0 || height !== bottoms[index - 1]);
        }

        function placementOrder(container) {
            return container.placed_items
                .map((item, itemIndex) => ({ item, itemIndex }))
                .sort((left, right) =>
                    left.item.coords.z - right.item.coords.z
                    || right.item.coords.y - left.item.coords.y
                    || left.item.coords.x - right.item.coords.x
                    || left.itemIndex - right.itemIndex
                );
        }

        function galleryPosition(index) {
            const column = index % galleryColumns;
            const row = Math.floor(index / galleryColumns);
            return new THREE.Vector3(
                column * (maxContainerWidth + 50),
                0,
                row * (maxContainerLength + 50)
            );
        }

        const containersList = document.getElementById("containers-list");
        containers.forEach((container, containerIndex) => {
            const group = new THREE.Group();
            scene.add(group);

            const containerGeometry = new THREE.BoxGeometry(
                container.width,
                container.height,
                container.length
            );
            const wire = new THREE.LineSegments(
                new THREE.EdgesGeometry(containerGeometry),
                new THREE.LineBasicMaterial({ color: 0x6b7280 })
            );
            wire.position.set(
                container.width / 2,
                container.height / 2,
                container.length / 2
            );
            group.add(wire);

            const containerLabel = createLabel(container.name, 40);
            containerLabel.position.set(
                container.width / 2,
                container.height + 8,
                container.length / 2
            );
            group.add(containerLabel);

            const gridSize = Math.max(container.width, container.length);
            const sliceGrid = new THREE.GridHelper(gridSize, 10, 0x7392ff, 0x26365d);
            sliceGrid.position.set(container.width / 2, 0.01, container.length / 2);
            sliceGrid.scale.set(container.width / gridSize, 1, container.length / gridSize);
            sliceGrid.visible = false;
            group.add(sliceGrid);

            const axisLength = Math.max(
                8,
                Math.min(container.width, container.height, container.length) * 0.3
            );
            const axisHelper = new THREE.AxesHelper(axisLength);
            axisHelper.material.depthTest = false;
            axisHelper.renderOrder = 3000;
            axisHelper.visible = false;
            group.add(axisHelper);

            const card = document.createElement("div");
            card.className = "container-card";
            const selectButton = document.createElement("button");
            selectButton.className = "container-select";
            selectButton.type = "button";
            selectButton.addEventListener("click", () => selectContainer(containerIndex));

            const usedVolume = container.placed_items.reduce(
                (sum, item) => sum + item.coords.w * item.coords.l * item.coords.h,
                0
            );
            const capacity = container.width * container.height * container.length;
            const utilization = capacity === 0 ? "0.0" : ((usedVolume / capacity) * 100).toFixed(1);
            const heading = document.createElement("strong");
            heading.className = "container-heading";
            heading.textContent = `${container.name} (${utilization}%)`;
            const meta = document.createElement("span");
            meta.className = "container-meta";
            meta.textContent = `${container.placed_items.length} boxes · W ${container.width} × L ${container.length} × H ${container.height}`;
            selectButton.append(heading, meta);
            card.append(selectButton);

            const itemList = document.createElement("div");
            itemList.className = "item-list";
            const viewItems = [];
            placementOrder(container).forEach(({ item, itemIndex }, placementIndex) => {
                const id = `item-${containerIndex}-${itemIndex}`;
                const itemGeometry = new THREE.BoxGeometry(
                    item.coords.w,
                    item.coords.h,
                    item.coords.l
                );
                const itemMaterial = new THREE.MeshLambertMaterial({
                    color: item.color,
                    transparent: true,
                    opacity: 0.85
                });
                const mesh = new THREE.Mesh(itemGeometry, itemMaterial);
                mesh.position.set(
                    item.coords.x + item.coords.w / 2,
                    item.coords.z + item.coords.h / 2,
                    item.coords.y + item.coords.l / 2
                );
                const label = createLabel(item.name);
                label.position.copy(mesh.position);
                group.add(mesh);
                group.add(label);

                const meshEntry = {
                    mesh,
                    label,
                    id,
                    item,
                    containerIndex
                };
                meshes.push(meshEntry);
                viewItems.push(meshEntry);

                const row = document.createElement("button");
                row.className = "item-row";
                row.type = "button";
                row.setAttribute("aria-label", `Placement ${placementIndex + 1}: ${item.name}`);
                row.addEventListener("click", () => highlightItem(id));

                const step = document.createElement("span");
                step.className = "placement-step";
                step.textContent = placementIndex + 1;
                const name = document.createElement("span");
                name.className = "item-name";
                name.textContent = item.name;
                const dimensions = document.createElement("span");
                dimensions.className = "item-dimensions";
                dimensions.textContent = `W ${item.coords.w} × L ${item.coords.l} × H ${item.coords.h}`;
                row.append(step, name, dimensions);
                itemList.append(row);
            });

            card.append(itemList);
            containersList.append(card);
            containerViews.push({
                container,
                group,
                wire,
                containerLabel,
                sliceGrid,
                axisHelper,
                card,
                selectButton,
                items: viewItems,
                layers: layerBoundaries(container)
            });
        });

        const showAllButton = document.getElementById("show-all");
        const solidViewButton = document.getElementById("solid-view");
        const layerViewButton = document.getElementById("layer-view");
        const layerControls = document.getElementById("layer-controls");
        const layerLabel = document.getElementById("layer-label");
        const layerPosition = document.getElementById("layer-position");
        const layerItems = document.getElementById("layer-items");
        const layerSlider = document.getElementById("layer-slider");
        const previousLayerButton = document.getElementById("previous-layer");
        const nextLayerButton = document.getElementById("next-layer");
        const resetLayerCameraButton = document.getElementById("reset-layer-camera");

        function resetHighlight() {
            if (!highlightedObject) {
                return;
            }
            highlightedObject.mesh.material.emissive.setHex(0x000000);
            highlightedObject.mesh.scale.set(1, 1, 1);
            highlightedObject = null;
            rainbowTimer = 0;
        }

        function activeLayer(view) {
            const lower = view.layers[layerIndex] || 0;
            const upper = view.layers[layerIndex + 1] || view.container.height;
            return { lower, upper: Math.max(lower, upper) };
        }

        function itemStartsAtLayer(item, layer) {
            return Math.abs(item.coords.z - layer.lower) < 0.000001;
        }

        function restoreFullItem(entry) {
            entry.mesh.scale.set(1, 1, 1);
            entry.mesh.position.y = entry.item.coords.z + entry.item.coords.h / 2;
            entry.mesh.material.opacity = 0.85;
            entry.label.position.y = entry.mesh.position.y;
        }

        function layerFocusHeight(view, layer) {
            const startingItems = view.items.filter(
                (entry) => itemStartsAtLayer(entry.item, layer)
            );
            const highestTop = startingItems.reduce(
                (highest, entry) => Math.max(
                    highest,
                    entry.item.coords.z + entry.item.coords.h
                ),
                layer.lower
            );
            return (layer.lower + highestTop) / 2;
        }

        function updateToolbar() {
            const showingAll = selectedContainerIndex === null;
            showAllButton.setAttribute("aria-pressed", showingAll.toString());
            solidViewButton.setAttribute("aria-pressed", (viewMode === "solid").toString());
            layerViewButton.setAttribute("aria-pressed", (viewMode === "layers").toString());
            layerViewButton.disabled = showingAll || containers.length === 0;
            layerControls.hidden = viewMode !== "layers" || showingAll;

            containerViews.forEach((view, index) => {
                const active = index === selectedContainerIndex;
                view.card.classList.toggle("active", active);
                view.selectButton.setAttribute("aria-pressed", active.toString());
            });

            if (viewMode !== "layers" || showingAll) {
                return;
            }
            const view = containerViews[selectedContainerIndex];
            const layer = activeLayer(view);
            const startingItems = view.items.filter(
                (entry) => itemStartsAtLayer(entry.item, layer)
            );
            const previouslyPlacedItems = view.items.filter(
                (entry) => entry.item.coords.z < layer.lower
            );
            layerSlider.max = Math.max(0, view.layers.length - 1);
            layerSlider.value = layerIndex;
            layerLabel.textContent = `Layer ${layerIndex + 1} of ${view.layers.length}`;
            layerPosition.textContent = `${layer.lower.toLocaleString()} base height`;
            const layerDetails = [];
            if (startingItems.length > 0) {
                layerDetails.push(`Place now: ${startingItems.map((entry) => entry.item.name).join(", ")}`);
            }
            if (previouslyPlacedItems.length > 0) {
                layerDetails.push(`${previouslyPlacedItems.length} earlier boxes shown faintly`);
            }
            layerItems.textContent = layerDetails.length === 0
                ? "No boxes begin at this height."
                : layerDetails.join(" · ");
            previousLayerButton.disabled = layerIndex === 0;
            nextLayerButton.disabled = layerIndex >= view.layers.length - 1;
        }

        function sceneBounds() {
            const bounds = new THREE.Box3();
            containerViews.forEach((view) => {
                if (!view.group.visible) {
                    return;
                }
                const position = view.group.position;
                bounds.expandByPoint(new THREE.Vector3(position.x, position.y, position.z));
                bounds.expandByPoint(new THREE.Vector3(
                    position.x + view.container.width,
                    position.y + view.container.height,
                    position.z + view.container.length
                ));
            });
            if (bounds.isEmpty()) {
                bounds.expandByPoint(new THREE.Vector3(-1, -1, -1));
                bounds.expandByPoint(new THREE.Vector3(1, 1, 1));
            }
            return bounds;
        }

        function frameScene() {
            const bounds = sceneBounds();
            const center = bounds.getCenter(new THREE.Vector3());
            const size = bounds.getSize(new THREE.Vector3());
            const largestDimension = Math.max(size.x, size.y, size.z, 10);
            const distance = (largestDimension / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)))) * 1.65;

            camera.near = Math.max(0.1, distance / 1000);
            camera.far = Math.max(30000, distance * 20);
            camera.updateProjectionMatrix();

            if (viewMode === "layers" && selectedContainerIndex !== null) {
                const view = containerViews[selectedContainerIndex];
                const layer = activeLayer(view);
                camera.up.set(0, 1, 0);
                camera.position.set(center.x, bounds.max.y + distance, center.z + distance * 0.001);
                controls.target.set(center.x, layerFocusHeight(view, layer), center.z);
                controls.enableRotate = true;
                controls.minPolarAngle = 0;
                controls.maxPolarAngle = Math.PI * 0.495;
            } else {
                camera.up.set(0, 1, 0);
                camera.position.set(
                    center.x + distance,
                    center.y + distance * 0.65,
                    center.z + distance
                );
                controls.target.copy(center);
                controls.enableRotate = true;
                controls.minPolarAngle = 0;
                controls.maxPolarAngle = Math.PI;
            }
            controls.minDistance = largestDimension * 0.1;
            controls.maxDistance = largestDimension * 20;
            controls.update();
        }

        function refreshScene(shouldFrame = true) {
            resetHighlight();
            const showingAll = selectedContainerIndex === null;

            containerViews.forEach((view, index) => {
                const visible = showingAll || index === selectedContainerIndex;
                view.group.visible = visible;
                view.group.position.copy(showingAll ? galleryPosition(index) : new THREE.Vector3());
                view.containerLabel.visible = showingAll;
                view.sliceGrid.visible = false;
                view.axisHelper.visible = false;

                view.items.forEach((entry) => {
                    restoreFullItem(entry);
                    entry.mesh.visible = visible;
                    entry.label.visible = visible && !showingAll;
                });
            });

            if (viewMode === "layers" && !showingAll) {
                const view = containerViews[selectedContainerIndex];
                const layer = activeLayer(view);
                view.sliceGrid.visible = true;
                view.axisHelper.visible = true;
                view.sliceGrid.position.y = layer.lower + 0.01;
                view.items.forEach((entry) => {
                    const startsNow = itemStartsAtLayer(entry.item, layer);
                    const placedEarlier = entry.item.coords.z < layer.lower;
                    entry.mesh.visible = startsNow || placedEarlier;
                    entry.mesh.material.opacity = startsNow ? 0.9 : 0.18;
                    entry.label.visible = startsNow;
                });
            }

            updateToolbar();
            if (shouldFrame) {
                frameScene();
            } else if (viewMode === "layers" && selectedContainerIndex !== null) {
                const view = containerViews[selectedContainerIndex];
                const layer = activeLayer(view);
                const nextTargetY = layerFocusHeight(view, layer);
                camera.position.y += nextTargetY - controls.target.y;
                controls.target.y = nextTargetY;
                controls.update();
            }
        }

        function selectContainer(containerIndex) {
            selectedContainerIndex = containerIndex;
            layerIndex = 0;
            refreshScene();
        }

        function selectViewMode(mode) {
            if (mode === "layers" && selectedContainerIndex === null) {
                return;
            }
            viewMode = mode;
            layerIndex = 0;
            refreshScene();
        }

        function selectLayer(index) {
            if (selectedContainerIndex === null) {
                return;
            }
            const view = containerViews[selectedContainerIndex];
            layerIndex = Math.max(0, Math.min(index, view.layers.length - 1));
            refreshScene(false);
        }

        function highlightItem(id) {
            const target = meshes.find((entry) => entry.id === id);
            if (!target) {
                return;
            }
            if (selectedContainerIndex !== target.containerIndex) {
                selectedContainerIndex = target.containerIndex;
                layerIndex = 0;
                refreshScene();
            }
            if (viewMode === "layers") {
                const view = containerViews[target.containerIndex];
                let matchingLayer = 0;
                view.layers.forEach((height, index) => {
                    if (height <= target.item.coords.z) {
                        matchingLayer = index;
                    }
                });
                selectLayer(Math.max(0, matchingLayer));
            }
            resetHighlight();
            highlightedObject = target;
            rainbowTimer = 120;
            const position = target.mesh.getWorldPosition(new THREE.Vector3());
            if (viewMode !== "layers") {
                controls.target.copy(position);
            }
        }

        const unplacedList = document.getElementById("unplaced-list");
        if (unplaced.length === 0) {
            unplacedList.textContent = "✓ All Packed";
        } else {
            const section = document.createElement("div");
            section.className = "unplaced-section";
            unplaced.forEach((item) => {
                const tag = document.createElement("span");
                tag.className = "item-tag";
                tag.textContent = item.name;
                section.append(tag);
            });
            unplacedList.append(section);
        }

        showAllButton.addEventListener("click", () => {
            selectedContainerIndex = null;
            viewMode = "solid";
            layerIndex = 0;
            refreshScene();
        });
        solidViewButton.addEventListener("click", () => selectViewMode("solid"));
        layerViewButton.addEventListener("click", () => selectViewMode("layers"));
        layerSlider.addEventListener("input", () => selectLayer(Number(layerSlider.value)));
        previousLayerButton.addEventListener("click", () => selectLayer(layerIndex - 1));
        nextLayerButton.addEventListener("click", () => selectLayer(layerIndex + 1));
        resetLayerCameraButton.addEventListener("click", () => frameScene());
        document.getElementById("wireframe-toggle").addEventListener("click", () => {
            meshes.forEach((entry) => {
                entry.mesh.material.wireframe = !entry.mesh.material.wireframe;
            });
        });

        refreshScene();

        function animate() {
            requestAnimationFrame(animate);
            if (rainbowTimer > 0 && highlightedObject) {
                rainbowTimer -= 1;
                highlightedObject.mesh.material.emissive.setHSL(
                    (Date.now() * 0.005) % 1,
                    1,
                    0.5
                );
                highlightedObject.mesh.scale.set(
                    1.05,
                    1.05,
                    1.05
                );
                if (rainbowTimer === 0) {
                    highlightedObject.mesh.material.emissive.setHex(0x000000);
                    highlightedObject.mesh.scale.set(1, 1, 1);
                }
            }
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
