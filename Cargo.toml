[package]
name = "boxpacker"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bin-packing = { version = "=0.3.0", default-features = false, features = ["three-d"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
u-nesting-d3 = "=0.6.0"

[lints.rust]
unsafe_code = "forbid"
