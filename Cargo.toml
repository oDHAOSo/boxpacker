[package]
name = "boxpacker"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bin-packing = { version = "=0.3.0", default-features = false, features = ["three-d"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
u-nesting-d3 = "=0.6.0"

[dev-dependencies]
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "current_fixture"
harness = false

[lints.rust]
unsafe_code = "forbid"
